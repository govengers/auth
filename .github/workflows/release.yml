name: Release image

# Publishes ghcr.io/govengers/forwardauth: :main on every push to main, :1.2.3, :1.2, :1 and :latest on a v1.2.3 tag.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# One run per ref at a time, the newest last: a slower run of an older commit cannot re-point :main (or a
# version tag) after a newer one. A queued run is replaced by a newer one; a running one finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build and push ghcr.io/govengers/forwardauth
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow token
    # Third-party actions are pinned by commit SHA: this job holds packages: write, and a moved tag must not
    # change what runs with it. GitHub's own actions keep their major tag, as in govengers/.github.
    steps:
      - uses: actions/checkout@v7

      # The builder stage cross-compiles (--platform=$BUILDPLATFORM) and the runtime stage only copies a file,
      # so the arm64 image needs no QEMU.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/govengers/forwardauth
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/forwardauth.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
